# This file contains selected Kconfig options for the application.

CONFIG_RING_BUFFER=y
CONFIG_RING_BUFFER_LARGE=y
CONFIG_TRANSMISSION_INTERVAL=500
CONFIG_SAMPLING_INTERVAL=10000
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_RING_BUFFER=y
CONFIG_RING_BUFFER_LARGE=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Activates the use of Zephyr's API for sensors
CONFIG_SENSOR=y
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_SEND_UART=y
CONFIG_SEND_LORAWAN=y
# # Region defined by Everynet for use in Brazil
# # https://ns.docs.everynet.io/channel_plans/LA915A.html
# # The configured LoRaWAN region must also be selected in lorawan.interface
CONFIG_LORAMAC_REGION_LA915=y
CONFIG_LORAWAN_JOIN_PACKET=y
CONFIG_LORAWAN_DR=5
CONFIG_EVENT_TIMESTAMP_LORAWAN=y

CONFIG_APP_LOG_LEVEL_DBG=y
CONFIG_SENSOR_LOG_LEVEL_DBG=y
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=1
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LORAWAN_LOG_LEVEL_DBG=y
CONFIG_LORA_LOG_LEVEL_DBG=y

CONFIG_BT=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=y

CONFIG_BT_ATT_PREPARE_COUNT=1
CONFIG_BT_PERIPHERAL=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y  # Max +8 dBm for nRF52832/nRF52840

CONFIG_BT_L2CAP_TX_MTU=251
CONFIG_BT_BUF_ACL_RX_SIZE=260
CONFIG_BT_BUF_ACL_TX_SIZE=260
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

CONFIG_BT_RX_STACK_SIZE=1024

# Defines name that will be used to advertise device
CONFIG_BT_DEVICE_NAME="Pulga iot calib cafe01"
# Appearance = Generic Industrial Measurement Device
#CONFIG_BT_DEVICE_APPEARANCE=5248